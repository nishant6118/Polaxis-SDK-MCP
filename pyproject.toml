[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "polaxis"
version = "0.1.0"
description = "Python SDK for the Polaxis AI Agent Governance Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Polaxis", email = "sdk@polaxis.io" }]
keywords = [
  "ai", "agents", "governance", "policy", "compliance",
  "llm", "langchain", "openai", "mcp", "human-in-the-loop",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.12",
]

[project.urls]
Homepage       = "https://polaxis.io"
Documentation  = "https://docs.polaxis.io"
Repository     = "https://github.com/polaxis-io/polaxis-sdk"
"Bug Tracker"  = "https://github.com/polaxis-io/polaxis-sdk/issues"

[project.scripts]
polaxis-mcp = "polaxis_mcp.server:main"

[tool.setuptools.packages.find]
include = ["polaxis*", "polaxis_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
